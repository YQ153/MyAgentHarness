<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>通用 Agent</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="dot"></span>
        <span>通用 Agent</span>
      </div>
      <div class="controls">
        <select id="model-select" title="切换模型"></select>
        <!-- 记忆入口对所有人可见：记忆按主体收敛，认证关闭时是本地那一份 -->
        <button id="memory-open" type="button">记忆</button>
        <!-- 工作区面板：Agent 产出的文件都在这里，只读 -->
        <button id="workspace-open" type="button">工作区</button>
        <div id="auth-status" class="auth-status"></div>
      </div>
    </header>

    <div class="body">
      <!-- 会话清单：数据来自 GET /api/threads，点击可切回该会话的历史 -->
      <aside class="sidebar">
        <div class="sidebar-head">
          <span class="sidebar-title">会话</span>
          <button id="new-thread" type="button">新会话</button>
        </div>
        <div class="thread-toolbar">
          <input
            id="thread-search"
            type="search"
            class="thread-search"
            placeholder="搜索标题…"
            autocomplete="off"
          />
          <label class="thread-archived-toggle">
            <input id="thread-archived" type="checkbox" />
            <span>含已归档</span>
          </label>
        </div>
        <div id="thread-list" class="thread-list"></div>
      </aside>

      <main id="messages" class="messages"></main>
    </div>

    <footer class="composer">
      <textarea
        id="input"
        rows="1"
        placeholder="输入任务，Enter 发送，Shift+Enter 换行"
        autocomplete="off"
      ></textarea>
      <button id="stop" type="button" class="danger" hidden>停止</button>
      <button id="send" type="button">发送</button>
    </footer>
  </div>
  <!-- 管理面板：仅管理员可见 -->
  <div id="admin-modal" class="modal" style="display:none;">
    <div class="modal-backdrop"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h3>管理面板</h3>
        <button id="admin-close" type="button" class="icon-btn">&times;</button>
      </div>
      <div class="modal-tabs">
        <button type="button" class="tab active" data-tab="apikeys">API Keys</button>
        <button type="button" class="tab" data-tab="audit">审计日志</button>
      </div>
      <div id="tab-apikeys" class="tab-panel active">
        <form id="apikey-form" class="apikey-form">
          <label>角色</label>
          <select id="apikey-role" required>
            <option value="member" selected>member</option>
            <option value="admin">admin</option>
            <option value="viewer">viewer</option>
          </select>
          <label>作用域（空格分隔）</label>
          <input id="apikey-scopes" type="text" placeholder="例如：thread:list thread:read" />
          <label>描述</label>
          <input id="apikey-desc" type="text" placeholder="CLI 用" />
          <label>过期时间（可选，ISO8601）</label>
          <input id="apikey-expires" type="text" placeholder="2026-12-31T23:59:59" />
          <button type="submit" class="primary">创建 API Key</button>
        </form>
        <div id="apikey-list" class="apikey-list"></div>
      </div>
      <div id="tab-audit" class="tab-panel">
        <div class="audit-toolbar">
          <button id="audit-refresh" type="button">刷新</button>
        </div>
        <div class="audit-table-wrap">
          <table id="audit-table" class="audit-table">
            <thead>
              <tr><th>时间</th><th>类型</th><th>操作者</th><th>动作</th><th>结果</th><th>IP</th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- 长期记忆面板：数据来自 GET /api/memories，按主体收敛 -->
  <div id="memory-modal" class="modal" style="display:none;">
    <div class="modal-backdrop"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h3>我的记忆</h3>
        <button id="memory-close" type="button" class="icon-btn">&times;</button>
      </div>
      <div class="memory-panel">
        <p class="memory-hint">
          Agent 写进 <code>/memories/</code> 的内容会跨会话保留，并进入后续每一轮
          上下文。记错的内容在这里删掉——删除会记入审计日志。
        </p>
        <div class="memory-toolbar">
          <button id="memory-refresh" type="button">刷新</button>
        </div>
        <div id="memory-list" class="memory-list"></div>
      </div>
    </div>
  </div>

  <!-- 工作区文件面板：数据来自 GET /api/workspace/files 与 /file，只读 -->
  <div id="workspace-modal" class="modal" style="display:none;">
    <div class="modal-backdrop"></div>
    <div class="modal-content modal-wide">
      <div class="modal-header">
        <h3>工作区</h3>
        <button id="workspace-close" type="button" class="icon-btn">&times;</button>
      </div>
      <p class="workspace-hint">
        Agent 的文件读写、命令产物都落在这个目录里。面板<b>只读</b>——要改动请通过对话让 Agent 做，
        这样才会经过权限与审批链。
      </p>
      <div class="workspace-body">
        <div class="workspace-tree" id="workspace-tree"></div>
        <div class="workspace-preview" id="workspace-preview"></div>
      </div>
    </div>
  </div>

  <!-- API Key 复制弹窗 -->
  <div id="apikey-popup" class="modal" style="display:none;">
    <div class="modal-backdrop"></div>
    <div class="modal-content modal-small">
      <div class="modal-header">
        <h3>API Key 已创建</h3>
        <button id="popup-close" type="button" class="icon-btn">&times;</button>
      </div>
      <p class="hint">请立即复制，明文 key 只显示一次。</p>
      <div class="apikey-value-wrap">
        <input id="apikey-value" type="text" readonly />
        <button id="apikey-copy" type="button">复制</button>
      </div>
      <p id="copy-msg" class="copy-msg"></p>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
