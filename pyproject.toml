[project]
name = "myagentharness"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "deepagents>=0.7.14",
    "langgraph>=1.2.11",
    "langchain>=1.4.0",
    "langchain-deepseek>=1.1.0",
    # 多 Provider 支持：按密钥存在性条件注册，未配置 Key 时不会加载对应后端
    "langchain-openai>=1.6.2",
    "langchain-anthropic>=1.7.2",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "aiosqlite>=0.22.1",
    "pyjwt[crypto]>=2.9.0",
    "httpx>=0.27.0",
    "itsdangerous>=2.1.0",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# WHY 显式加项目根到 sys.path：测试直接按顶层包名导入
# （application / runtime / config），不依赖安装动作。
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
